name: Bug report
description: Something does not work as expected.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Suite version
      placeholder: e.g. 7.12.2
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Mode and seed
      description: Include these if the issue happens in a particular layout.
      placeholder: e.g. Hide & Seek Outside, seed 12345
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, replay, or diagnostics
      description: Optional. Attach a small example that shows the issue. Remove private information before sharing logs.
