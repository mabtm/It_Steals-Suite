name: Seed algorithm research

on:
  workflow_dispatch:
  push:
    branches: ['research/seed-performance-20261027']

permissions:
  contents: read

concurrency:
  group: seed-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contact-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exhaustive contact-bound checks
        run: python3 tests/run.py --only contact_bound_tests route_bound_tests physical_seed_tests --jobs 2 --output build/research-checks
      - name: Contact-bound memory and undefined-behavior checks
        run: python3 tests/run.py --sanitize --only contact_bound_tests --jobs 1 --output build/research-sanitizers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-bound-research
          path: |
            build/research-checks
            build/research-sanitizers
          retention-days: 14

  msvc-pgo:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Train and compare the production search with MSVC PGO
        shell: powershell
        run: .\tests\algorithm_windows_lab.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: msvc-seed-research
          path: build/algorithm-windows-lab
          retention-days: 14
