name: GPU dev suite

on:
  workflow_dispatch:
  push:
    branches: ['dev/gpu-7.19.0']

permissions:
  contents: read

concurrency:
  group: gpu-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate repository and production contracts
        run: |
          python3 repository.py sync
          python3 repository.py check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime
          python3 tests/run.py --ui --managed --jobs 2 --output build/gpu-dev-verification
      - name: Sanitize shared scoring and report validation
        run: python3 tests/run.py --sanitize --only gpu_dev_report_tests gpu_dev_catalog_tests gpu_dev_search_tests seed_neighbor_tests --jobs 1 --output build/gpu-dev-sanitizers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gpu-dev-verification
          path: |
            build/gpu-dev-verification/summary.json
            build/gpu-dev-verification/**/*.log
            build/gpu-dev-sanitizers/summary.json
            build/gpu-dev-sanitizers/**/*.log

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile the actual GPU dev suite
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          & $msbuild Trainer/ItStealsTrainer.vcxproj /m /t:Rebuild /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SuiteGpuDev=true "/p:SuiteDevSourceCommit=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'GPU dev trainer compilation failed.' }
      - name: Test embedded shaders and complete pickup scoring
        run: |
          & .\tests\gpu_dev_windows_probe.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'GPU dev integration tests failed.' }
      - name: Test actual native startup and retained controls
        run: |
          & .\tests\launcher_windows_tests.ps1 -TrainerBinary .\bin\ItStealsTrainer.exe
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'GPU dev launcher checks failed.' }
      - name: Build the dev portable distribution
        run: |
          if (-not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
          & .\Installer\Release.ps1 -SkipBuild -TrainerBinary .\bin\ItStealsTrainer.exe -SourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Dev packaging failed.' }
          Copy-Item build/release/ItStealsSuite-Portable.zip build/release/ItStealsSuite-GPU-Dev.zip
          $info = [ordered]@{
            channel = 'GPU Dev 6'
            sourceCommit = $env:GITHUB_SHA
            baseVersion = '7.19.0'
            modVersion = '7.19.0'
            trainerSha256 = (Get-FileHash bin/ItStealsTrainer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            archiveSha256 = (Get-FileHash build/release/ItStealsSuite-GPU-Dev.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            instructions = 'https://github.com/mabtm/It_Steals-Suite/blob/dev/gpu-7.19.0/GPU_DEV.md'
          }
          $info | ConvertTo-Json | Set-Content build/release/GPU-Dev-Info.json -Encoding UTF8
          $hashes = @('ItStealsSuite-GPU-Dev.zip','GPU-Dev-Info.json') | ForEach-Object {
            (Get-FileHash (Join-Path 'build/release' $_) -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'build/release/GPU-Dev-SHA256SUMS.txt'), $hashes, (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gpu-dev-windows
          path: |
            build/release/ItStealsSuite-GPU-Dev.zip
            build/release/GPU-Dev-Info.json
            build/release/GPU-Dev-SHA256SUMS.txt
            build/gpu-dev-check/**/*.json
            build/windows-launcher-tests/summary.json
  publish:
    needs: [verify, windows]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retrieve the verified dev archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name gpu-dev-windows --dir build/dev-distribution
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the verified Windows dev package.' }
      - name: Publish the verified dev prerelease
        if: github.ref == 'refs/heads/dev/gpu-7.19.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem build/dev-distribution -Filter ItStealsSuite-GPU-Dev.zip -Recurse | Select-Object -First 1
          if (-not $archive) { throw 'Verified dev archive is missing.' }
          $assetFolder = $archive.Directory.FullName
          $info = Get-Content (Join-Path $assetFolder 'GPU-Dev-Info.json') -Raw | ConvertFrom-Json
          if ($info.sourceCommit -ne $env:GITHUB_SHA -or (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $info.archiveSha256) { throw 'Dev package provenance/checksum mismatch.' }
          $tag = 'gpu-dev-7.19.0.6' 
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          $release = @($existing | ConvertFrom-Json) | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($release -and -not $release.draft) { throw 'This dev tag is already published. Increment the dev tag before publishing another build.' }
          if ($release -and $release.target_commitish -ne $env:GITHUB_SHA) { throw 'This draft belongs to another source commit.' }
          if (-not $release) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'PracticeSuite 7.19.0 / GPU Dev 6' --notes-file GPU_DEV.md --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create dev prerelease draft.' }
          }
          $assets = @('ItStealsSuite-GPU-Dev.zip','GPU-Dev-Info.json','GPU-Dev-SHA256SUMS.txt') | ForEach-Object { Join-Path $assetFolder $_ }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Dev assets could not be uploaded; release remains a draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the dev prerelease.' }
