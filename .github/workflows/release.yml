name: Build and publish Elite-Suite

on:
  workflow_dispatch:
  push:
    branches: [main, dev/elite-suite]
    tags: ['v*']
    paths:
      - 'README.md'
      - 'DEVELOPING.md'
      - 'CHANGELOG.md'
      - 'repository.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'Trainer/**'
      - 'Mod/**'
      - 'Installer/**'
      - 'assets/**'
      - 'bin/**'
      - 'tests/**'
      - 'protocol-layout.json'
      - 'generate-layout.py'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production logic and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sync and check repository presentation
        run: |
          python3 repository.py sync
          python3 repository.py check
      - name: Install managed test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime
      - name: Test production logic, UI, and managed contracts
        run: python3 tests/run.py --ui --managed --jobs 2 --output build/verification
      - name: Check search memory and undefined behavior
        run: python3 tests/run.py --only seed_gpu_tests seed_gpu_catalog_tests seed_gpu_kernel_tests navigation_visibility_tests navigation_startup_tests physical_repair_tests timer_preparation_tests navigation_diagnostic_tests font_catalog_tests ui_motion_audio_tests performance_timing_tests milestone_tests replay_motion_tests run_data_tests replay_split_tests split_pace_tests replay_tests split_file_tests --sanitize --jobs 2 --output build/gpu-sanitizers
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-verification
          path: |
            build/gpu-sanitizers/summary.json
            build/gpu-sanitizers/**/*.log
            build/verification/summary.json
            build/verification/**/*.log
            build/verification/replay_experience_tests/work/clock-arguments.json
          retention-days: 14
          if-no-files-found: warn

  verify-windows-native:
    name: Windows native production contracts
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify routing, fonts, diagnostics and interface timing with MSVC
        shell: powershell
        run: |
          & .\tests\launcher_windows_tests.ps1 -NativeOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Windows native production contracts failed.' }

  release:
    name: Windows build, installer, and release
    needs: [verify, verify-windows-native]
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure NSIS 3 is installed
        run: |
          if (-not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
      - name: Verify installer contracts and pinned official loader
        run: |
          & .\tests\installer_tests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Installer contract tests failed.' }
      - name: Verify transactional updater and process ownership
        run: |
          & .\tests\updater_tests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Updater contract tests failed.' }
      - name: Build native trainer and all release packages
        run: |
          try {
            & .\Installer\Release.ps1 -PlatformToolset v143 -SourceCommit $env:GITHUB_SHA
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
          } catch {
            $message = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            throw
          }
      - name: Verify actual production GPU shaders, coordinator, calibration and CPU fault recovery
        run: |
          & .\tests\seed_gpu_windows_tests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Production GPU integration checks failed.' }
      - name: Verify 1080p60/120 and sustained AVI timing with the shipped encoder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name production-verification --dir build/export-input
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the production export arguments.' }
          $plan = Get-ChildItem build/export-input -Filter clock-arguments.json -Recurse | Select-Object -First 1
          if (-not $plan) { throw 'Production export arguments are missing.' }
          python tests/verify_audio_exports.py $plan.Directory.FullName bin/PracticeSuiteEncoder.exe --avi-only
          if ($LASTEXITCODE -ne 0) { throw 'The shipped encoder failed an audio/video timing check.' }
      - name: Test the real Windows launcher against a controlled executable
        run: |
          & .\tests\launcher_windows_tests.ps1 -TrainerBinary .\build\release\ItStealsTrainer.exe -SkipNative
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Native launcher smoke test failed.' }
      - name: Test native capture and production updater with repository visibility
        env:
          SUITE_UPDATE_TEST_TOKEN: ${{ github.token }}
        run: |
          & .\tests\updater_windows_tests.ps1 -PublicRelease:('${{ github.event.repository.private }}' -eq 'false')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Native updater transport test failed.' }
      - name: Retain packages and Windows verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-distribution
          path: |
            build/release/*
            build/windows-seed-gpu/*.log
            build/installer-tests/summary.json
            build/windows-launcher-tests/summary.json
            build/updater-tests/summary.json
            build/windows-updater-tests/summary.json
            build/export-input/**/verified-export-clock.json
            build/export-input/**/*-encoder.log
          retention-days: 14
          if-no-files-found: warn
      - name: Refresh the supplied trainer from the verified Windows build
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          $ErrorActionPreference = 'Stop'
          python repository.py sync
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the README spotlight.' }
          git add -- bin/ItStealsTrainer.exe README.md
          git diff --cached --quiet -- bin/ItStealsTrainer.exe README.md
          if ($LASTEXITCODE -eq 1) {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update verified Elite-Suite trainer [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the verified trainer.' }
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'The source branch changed; inspect it before retrying publication.' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Could not compare the supplied trainer.'
          }
      - name: Publish a complete release after every check passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $header = Get-Content .\Trainer\SuiteBranding.h -Raw
          $version = [regex]::Match($header, '#define SUITE_VERSION "(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $version) { throw 'Release version is missing.' }
          $preview = $env:GITHUB_REF -ne 'refs/heads/main' -or $header -match '#define SUITE_PREVIEW 1'
          $tag = if ($preview) { "v$version-preview.$env:GITHUB_RUN_NUMBER" } else { "v$version" }
          "SUITE_RELEASE_PREVIEW=$preview" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($preview) {
            $stableTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
            if ($LASTEXITCODE -ne 0 -or $stableTag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Could not establish the current stable release.' }
            "STABLE_BASELINE_TAG=$stableTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          $release = @($existing | ConvertFrom-Json) | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($release -and -not $release.draft) {
            Write-Output "Release $tag is already published. Increment SUITE_VERSION to publish another version."
            exit 0
          }
          if ($release -and $release.target_commitish -ne $env:GITHUB_SHA) {
            throw 'A draft for this version belongs to another commit. Review it before reusing the version.'
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'practice-suite-release.md'
          python repository.py notes $version --tag $tag --output $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the release notes.' }
          if (-not $release) {
            $create = @('release','create',$tag,'--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',"Elite-Suite $tag",'--notes-file',$notesFile,'--draft')
            if ($preview) { $create += @('--prerelease','--latest=false') }
            & gh @create
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          $names = @('ItStealsSuite-Setup.exe','ItStealsSuite-Portable.zip','ItStealsTrainer.exe','PracticeSuiteEncoder.exe','ItStealsHelper.dll','Encoder-Sources.zip','SHA256SUMS.txt')
          $assets = @($names | ForEach-Object {
            $path = Join-Path (Get-Location) "build/release/$_"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset: $_" }
            $path
          })
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          if ($preview) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Verify preview publication leaves the stable update channel intact
        if: env.SUITE_RELEASE_PREVIEW == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.prerelease -or $latest.tag_name -ne $env:STABLE_BASELINE_TAG) {
            throw 'Preview publication changed the stable latest release.'
          }
          & .\build\windows-updater-tests\contract.exe --anonymous
          if ($LASTEXITCODE -ne 0) { throw 'The production stable updater failed after preview publication.' }
          Write-Output "Stable channel preserved: $($latest.tag_name)."
      - name: Refresh release pages
        if: env.SUITE_RELEASE_PREVIEW == 'False'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python repository.py refresh-releases --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh release descriptions.' }
